[package]
name = "wup"
version = "0.1.1"
edition = "2024"
description = "A selective Windows Package Manager update UI built with GPUI"
license = "MIT"

[dependencies]
gpui = "=0.2.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = "debuginfo"


[target.'cfg(windows)'.build-dependencies]
embed-resource = "=3.0.12"
