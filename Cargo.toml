[package]
name = "wup"
version = "0.1.1"
edition = "2024"
description = "A selective Windows Package Manager update UI built with GPUI"
license = "MIT"

[dependencies]
gpui = "=0.2.2"
unicode-segmentation = "=1.13.3"

[profile.release]
opt-level = 3
lto = "thin"
strip = "debuginfo"


[target.'cfg(windows)'.build-dependencies]
embed-resource = "=3.0.12"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "=0.6.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[patch.crates-io]
proc-macro-error2 = { path = "vendor/proc-macro-error2" }
